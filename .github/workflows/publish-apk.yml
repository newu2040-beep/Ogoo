name: Publish APK Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apk-distribution/app-debug.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK and Checksum
        run: |
          set -euo pipefail

          APK_PATH="apk-distribution/app-debug.apk"
          CHECKSUM_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH does not exist" >&2
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty" >&2
            exit 1
          fi

          if [ ! -f "$CHECKSUM_PATH" ]; then
            echo "Error: $CHECKSUM_PATH does not exist" >&2
            exit 1
          fi

          echo "Verifying SHA-256 checksum..."
          cd apk-distribution
          sha256sum -c app-debug.apk.sha256
          cd ..

          echo "Verifying ZIP archive integrity..."
          unzip -tq "$APK_PATH"
          echo "APK validation passed successfully."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_PATH="apk-distribution/app-debug.apk"
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          REPO="${{ github.repository }}"

          echo "Creating GitHub Release with tag: $TAG"
          gh release create "$TAG" "$APK_PATH#app-debug.apk" \
            --title "Debug APK ($TAG)" \
            --notes "Automated Debug APK release for $REPO. Tag: $TAG. SHA-256: $APK_SHA" \
            --latest

          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          DOWNLOAD_URL="https://github.com/$REPO/releases/latest/download/app-debug.apk"

          echo "### APK Release Published Successfully! :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag:** \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Size:** \`$APK_SIZE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA-256 Checksum:** \`$APK_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Direct Latest APK Download URL:** [$DOWNLOAD_URL]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"

          echo "Release Tag: $TAG"
          echo "APK Size: $APK_SIZE"
          echo "SHA-256 Checksum: $APK_SHA"
          echo "GitHub Release Page: $RELEASE_URL"
          echo "Direct Download URL: $DOWNLOAD_URL"
